<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Omen Bag — замовлення</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #fff); --tx: var(--tg-theme-text-color, #111); --hint: var(--tg-theme-hint-color, #888);
          --sec: var(--tg-theme-secondary-bg-color, #f2f2f2); --btn: #ffd600; --btx: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 14px 90px; background: var(--bg); color: var(--tx); font: 15px/1.35 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .art { color: var(--hint); margin-bottom: 4px; }
  .cina { display: inline-block; background: var(--btn); color: var(--btx); font-weight: 700; border-radius: 8px; padding: 2px 10px; margin-bottom: 12px; }
  .kol { display: flex; align-items: center; gap: 10px; background: var(--sec); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .kol img { width: 56px; height: 56px; object-fit: contain; background: #fff; border-radius: 8px; flex: none; }
  .nm { flex: 1; min-width: 0; }
  .nm b { display: flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #ccc; flex: none; }
  .ye { color: var(--hint); font-size: 13px; }
  input { width: 64px; padding: 8px 6px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; text-align: center; background: #fff; color: #111; }
  button { border: 0; border-radius: 8px; padding: 9px 12px; font-size: 15px; font-weight: 600; background: var(--btn); color: var(--btx); }
  button.ok { background: #2e7d32; color: #fff; }
  .msg { color: var(--hint); text-align: center; margin-top: 30px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: var(--bg); border-top: 1px solid var(--sec); }
  .bar button { width: 100%; padding: 13px; font-size: 16px; }
</style>
</head>
<body>
<div id="app"><div class="msg">Завантаження…</div></div>
<div class="bar"><button id="ofo">🧾 Кошик / Оформити</button></div>
<script>
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const API = window.OMEN_API;
  const h = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('h') || '';
  const app = document.getElementById('app');
  let bot = '';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function zavantazhyty() {
    if (!h) { app.innerHTML = '<div class="msg">Відкрийте з кнопки під товаром у каналі.</div>'; return; }
    try {
      const r = await (await fetch(API + '?a=tovar&h=' + encodeURIComponent(h))).json();
      if (r.err) { app.innerHTML = '<div class="msg">' + esc(r.err) + '</div>'; return; }
      bot = r.bot;
      app.innerHTML = '<h1>' + esc(r.nazva) + '</h1><div class="art">Арт. ' + esc(r.art) + '</div>' +
        (r.cina ? '<div class="cina">Опт ' + esc(r.cina) + '</div>' : '') +
        r.kolory.map((k, i) => '<div class="kol">' + (k.foto ? '<img src="' + esc(k.foto) + '" alt="">' : '') +
          '<div class="nm"><b><span class="dot" style="background:' + esc(k.hex) + '"></span>' + esc(k.n) + '</b>' +
          '<div class="ye">' + (k.ye > 0 ? 'в наявності ' + k.ye + ' шт.' : 'немає в наявності') + '</div></div>' +
          (k.ye > 0 ? '<input type="number" inputmode="numeric" min="1" max="' + k.ye + '" value="1" id="n' + i + '">' +
            '<button id="b' + i + '" onclick="dodaty(' + i + ')">Додати</button>' : '') + '</div>').join('');
    } catch (e) { app.innerHTML = '<div class="msg">Немає зв\'язку. Спробуйте ще раз.</div>'; }
  }

  async function dodaty(i) {
    const b = document.getElementById('b' + i), n = Number(document.getElementById('n' + i).value);
    if (!(n >= 1)) { tg && tg.showAlert('Вкажіть кількість числом'); return; }
    b.disabled = true; b.textContent = '…';
    try {
      const r = await (await fetch(API + '?a=dodaty', { method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ initData: tg ? tg.initData : '', h: h, i: i, n: n }) })).json();
      if (r.err) { tg ? tg.showAlert(r.err) : alert(r.err); b.textContent = 'Додати'; b.disabled = false; return; }
      b.textContent = '✓ ' + r.n; b.className = 'ok'; b.disabled = false;
      if (r.prym) tg && tg.showAlert(r.prym);
      document.getElementById('ofo').textContent = '🧾 Оформити · ' + r.poz + ' поз., ' + r.shtuk + ' шт.';
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    } catch (e) { b.textContent = 'Додати'; b.disabled = false; tg && tg.showAlert('Немає зв\'язку, спробуйте ще раз'); }
  }

  document.getElementById('ofo').onclick = () => {
    const u = 'https://t.me/' + bot + '?start=koshyk';
    if (tg) { tg.openTelegramLink(u); tg.close(); } else location.href = u;
  };
  zavantazhyty();
</script>
</body>
</html>
